name: Build V0.8.1 candidate

on:
  push:
    branches: [v0.8.1-candidate]
    paths:
      - "releases/V0.8.1/build_trigger.txt"
      - "releases/V0.8.1/build.py"
      - "releases/V0.8.1/source/patch_chunks/**"
      - "releases/V0.8.1/validators/validate.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8.1-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build candidate from locked V0.8
        run: python releases/V0.8.1/build.py
      - name: Validate candidate contract
        run: |
          python releases/V0.8.1/validators/validate.py \
            published/V0.8.1_CANVAS_Cellular_architecture_and_neighborhood-informed_virtual_spatial_tumor_profiling.html \
            --sha256 6b5e13ae62361b2b10ac2d3abdbb51eda0188a102195b0384b037463cb3ab013
      - name: Commit candidate artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/V0.8.1_CANVAS_Cellular_architecture_and_neighborhood-informed_virtual_spatial_tumor_profiling.html
          if git diff --cached --quiet; then
            echo "Candidate artifact already current"
          else
            git commit -m "Build V0.8.1 CANVAS candidate HTML"
            git push origin HEAD:v0.8.1-candidate
          fi
