name: Browser regression V0.8.2 CANVAS

on:
  push:
    branches: [v0.8x-batch-diagnosis]
    paths:
      - ".github/workflows/browser_regression_v082.yml"
      - "tools/browser_regression_v082.py"
      - "tools/normalize_v082_canvas_master.py"
      - "tools/render_v082_canvas_component_locked*.py"
      - "tools/migrate_v082_batch_to_manifest.py"
      - "schemas/paper_content_manifest_v082.schema.json"
      - "experiments/V0.8.2_template_lock/fixtures/smoke_manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: Build normalized master and comparison readers
        shell: bash
        run: |
          set -euo pipefail
          CANVAS_ORIGINAL=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          MAAS=$(find . -maxdepth 1 -name '01_V0.8.2_Maas*.html' | head -n 1)
          VAL=$(find . -maxdepth 1 -name '04_V0.8.2_Valanarasu*.html' | head -n 1)
          ROOT=experiments/V0.8.2_template_lock
          MASTER="$ROOT/output/V0.8.2_CANVAS_NORMALIZED_MASTER.html"
          mkdir -p "$ROOT/manifests" "$ROOT/output" "$ROOT/reports"
          python tools/normalize_v082_canvas_master.py "$CANVAS_ORIGINAL" "$MASTER" --report "$ROOT/reports/NORMALIZED_MASTER.json"
          python tools/migrate_v082_batch_to_manifest.py "$MAAS" "$ROOT/manifests/MAAS_LEGACY_CONTENT.json"
          python tools/migrate_v082_batch_to_manifest.py "$VAL" "$ROOT/manifests/VALANARASU_LEGACY_CONTENT.json"
          python tools/render_v082_canvas_component_locked_v2.py "$ROOT/fixtures/smoke_manifest.json" "$ROOT/output/V0.8.2_COMPONENT_LOCKED_SMOKE.html" --canonical "$MASTER" --schema schemas/paper_content_manifest_v082.schema.json
          python tools/render_v082_canvas_component_locked_v2.py "$ROOT/manifests/MAAS_LEGACY_CONTENT.json" "$ROOT/output/V0.8.2_COMPONENT_LOCKED_MAAS_LEGACY_CONTENT.html" --canonical "$MASTER" --schema schemas/paper_content_manifest_v082.schema.json
          python tools/render_v082_canvas_component_locked_v2.py "$ROOT/manifests/VALANARASU_LEGACY_CONTENT.json" "$ROOT/output/V0.8.2_COMPONENT_LOCKED_VALANARASU_LEGACY_CONTENT.html" --canonical "$MASTER" --schema schemas/paper_content_manifest_v082.schema.json
      - name: Run browser diagnostics
        shell: bash
        run: |
          python tools/browser_regression_v082.py \
            experiments/V0.8.2_template_lock/output/V0.8.2_CANVAS_NORMALIZED_MASTER.html \
            experiments/V0.8.2_template_lock/output/V0.8.2_COMPONENT_LOCKED_SMOKE.html \
            experiments/V0.8.2_template_lock/output/V0.8.2_COMPONENT_LOCKED_MAAS_LEGACY_CONTENT.html \
            experiments/V0.8.2_template_lock/output/V0.8.2_COMPONENT_LOCKED_VALANARASU_LEGACY_CONTENT.html \
            --root . \
            --report experiments/V0.8.2_template_lock/reports/BROWSER_REGRESSION.json \
            --diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: v082-browser-regression
          path: |
            experiments/V0.8.2_template_lock/output
            experiments/V0.8.2_template_lock/reports/BROWSER_REGRESSION.json
            experiments/V0.8.2_template_lock/reports/NORMALIZED_MASTER.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit browser report and rebuilt outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/V0.8.2_template_lock/output experiments/V0.8.2_template_lock/reports/BROWSER_REGRESSION.json experiments/V0.8.2_template_lock/reports/NORMALIZED_MASTER.json
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "Record normalized-master browser diagnostics"
            git push origin HEAD:v0.8x-batch-diagnosis
          fi
