name: Prefetch V0.8.2 exact blocked sources

on:
  push:
    branches: [v0.8x-batch-diagnosis]
    paths:
      - ".github/workflows/prefetch_v082_exact_sources_autorun.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v082-exact-blocked-source-autorun
  cancel-in-progress: true

env:
  CHO_ADOBE_PREVIEW_URL: "https://to.adobe.com/phMsfMA7YPzZqvAdG8hYM4vE9jVf"
  CHO_CACHE_KEY: "v082-cho-source-adz2742-24p-v1"
  LUCAS_ADOBE_URL: "https://at.adobe.com/7lRkqBUBDXjL38Lv"
  LUCAS_CACHE_KEY: "v082-lucas-source-s41588-024-01747-1-31p-v1"

jobs:
  prefetch-cho:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and Chromium dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 curl_cffi lxml PyMuPDF playwright
          python -m playwright install --with-deps chromium
      - name: Restore dedicated Cho source cache
        id: cho-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/cho-source
          key: ${{ env.CHO_CACHE_KEY }}
      - name: Materialize and validate the user-supplied Science PDF
        run: |
          set -euo pipefail
          mkdir -p .build/v082/cho-source .build/v082/science-prefetch
          python tools/prefetch_v082_adobe_shared_pdf.py \
            --url "$CHO_ADOBE_PREVIEW_URL" \
            --output .build/v082/cho-source/07_cho-2026.pdf \
            --report .build/v082/science-prefetch/CHO_SOURCE_FINAL.json \
            --expected-pages 24 \
            --doi 10.1126/science.adz2742 \
            --title-fragment "Pan-cancer spatial atlas of tertiary lymphoid structures"
      - name: Save dedicated Cho source cache
        if: success() && steps.cho-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/cho-source
          key: ${{ env.CHO_CACHE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-cho-exact-source-audit
          path: .build/v082/science-prefetch
          if-no-files-found: warn
          retention-days: 30

  prefetch-lucas:
    needs: prefetch-cho
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and Chromium dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 lxml PyMuPDF playwright
          python -m playwright install --with-deps chromium
      - name: Restore dedicated Lucas final-source cache
        id: lucas-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/lucas-source
          key: ${{ env.LUCAS_CACHE_KEY }}
      - name: Materialize and validate the user-supplied final Nature Genetics PDF
        run: |
          set -euo pipefail
          mkdir -p .build/v082/lucas-source .build/v082/lucas-prefetch
          python tools/prefetch_v082_adobe_shared_pdf.py \
            --url "$LUCAS_ADOBE_URL" \
            --output .build/v082/lucas-source/09_lucas-2024.pdf \
            --report .build/v082/lucas-prefetch/LUCAS_SOURCE_FINAL.json \
            --expected-pages 31 \
            --doi 10.1038/s41588-024-01747-1 \
            --title-fragment "Spatial genomic biochemical and cellular mechanisms underlying meningioma heterogeneity and evolution"
      - name: Save dedicated Lucas final-source cache
        if: success() && steps.lucas-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/lucas-source
          key: ${{ env.LUCAS_CACHE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-lucas-exact-source-audit
          path: .build/v082/lucas-prefetch
          if-no-files-found: warn
          retention-days: 30

