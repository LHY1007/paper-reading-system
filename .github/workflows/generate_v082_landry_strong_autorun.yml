name: Apply V0.8.2 sentence-pair upgrade

on:
  push:
    branches:
      - v0.8x-batch-diagnosis
    paths:
      - .github/workflows/generate_v082_landry_strong_autorun.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v082-sentence-pair-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema lxml
      - name: Apply verified bundle
        run: python tools/apply_v082_sentence_pair_upgrade.py
      - name: Run sentence-pair tests
        run: |
          python tools/test_v082_sentence_pairs.py
          python tools/validate_v082_sentence_pairs.py tests/fixtures/v082_shell_smoke_manifest.json --report /tmp/SENTENCE_PAIR_GATE.json
          python tools/validate_v082_manifest_code_boundary.py tests/fixtures/v082_shell_smoke_manifest.json --report /tmp/MANIFEST_CODE_BOUNDARY.json
      - name: Render and validate fixed-shell smoke reader
        run: |
          python tools/render_v082_from_frozen_shell.py tests/fixtures/v082_shell_smoke_manifest.json /tmp/V082_SENTENCE_SMOKE_READER.html --shell templates/v082/V082_CANVAS_FROZEN_SHELL.html --lock config/v082_frozen_shell_lock.json --schema schemas/paper_content_manifest_v082.schema.json --report /tmp/SMOKE_RENDER.json
          python tools/validate_v082_rendered_architecture.py /tmp/V082_SENTENCE_SMOKE_READER.html --shell templates/v082/V082_CANVAS_FROZEN_SHELL.html --manifest tests/fixtures/v082_shell_smoke_manifest.json --lock config/v082_frozen_shell_lock.json --report /tmp/SMOKE_RENDERED_ARCHITECTURE.json
      - name: Commit proven upgrade
        run: |
          rm -rf .github/v082-sentence-upgrade
          rm -f tools/apply_v082_sentence_pair_upgrade.py
          rm -f .github/workflows/apply_v082_sentence_pair_upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce sentence-paired bilingual V0.8.2 readers"
          git fetch origin v0.8x-batch-diagnosis
          git rebase origin/v0.8x-batch-diagnosis
          git push origin HEAD:v0.8x-batch-diagnosis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-sentence-pair-upgrade-proof
          path: |
            /tmp/SENTENCE_PAIR_GATE.json
            /tmp/MANIFEST_CODE_BOUNDARY.json
            /tmp/SMOKE_RENDER.json
            /tmp/SMOKE_RENDERED_ARCHITECTURE.json
            /tmp/V082_SENTENCE_SMOKE_READER.html
          if-no-files-found: warn
          retention-days: 14
