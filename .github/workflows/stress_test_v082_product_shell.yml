name: Stress-test immutable V0.8.2 product shell

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stress_test_v082_product_shell.yml"
      - "templates/v082/V082_CANVAS_FROZEN_SHELL.html"
      - "config/v082_frozen_shell_lock.json"
      - "schemas/paper_content_manifest_v082.schema.json"
      - "tests/fixtures/v082_shell_smoke_manifest.json"
      - "tools/render_v082_from_frozen_shell.py"
      - "tools/render_v082_canvas_component_locked*.py"
      - "tools/validate_v082_rendered_architecture.py"
      - "tools/browser_layout_invariance_v082*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v082-product-shell-stress
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Build a content-extreme manifest without changing product code
        run: |
          mkdir -p .build/v082/stress reports/v082-stress
          python - <<'PY'
          import copy, json, pathlib
          source=pathlib.Path('tests/fixtures/v082_shell_smoke_manifest.json')
          base=json.loads(source.read_text('utf-8'))
          stress=copy.deepcopy(base)
          stress['paper']['key']='stress-layout-paper'
          stress['paper']['title_en']='A deliberately long biomedical paper title used to verify immutable reader geometry across radically different paper content, metadata density, section length and figure descriptions'
          stress['paper']['title_zh']='用于验证不同论文内容、元数据密度、章节长度和图表说明下阅读器几何结构完全不变的超长生物医学论文标题'
          stress['paper']['authors']=[f'Author {i}' for i in range(1,31)]
          stress['paper']['affiliations']=[f'Institution {i}, Department of Biomedical Research, City, Country' for i in range(1,16)]
          for item in stress['overview']['qa']:
              item['answer']=(item['answer']+' 本段通过增加内容密度测试文本换行、卡片高度和滚动行为，但不允许改变任何固定按钮、栏宽、配色、字体或交互组件。')*2
          stress['overview']['method']='数据准备→证据抽取→段落重建→逐段翻译→图表解释→来源核对→确定性渲染→浏览器回归→发布门禁'
          stress['overview']['story']=(stress['overview']['story']+' 该压力样本只改变可变论文数据，用于证明固定产品壳层不会因文本长度、作者数量或组件数量变化而重新排版。')*3
          section=stress['sections'][0]
          paragraph=next(block for block in section['blocks'] if block['type']=='paragraph')
          new_blocks=[]
          for i in range(1,31):
              block=copy.deepcopy(paragraph)
              block['id']=f'stress-paragraph-{i}'
              block['english']=[{'text':(paragraph['english'][0]['text']+' Additional source-faithful biomedical context is repeated only to stress scrolling and wrapping. ')*3}]
              block['chinese']=[{'text':(paragraph['chinese'][0]['text']+' 这里增加文本只用于测试滚动和换行，不改变框架结构。')*3}]
              block['source_fragments']=[block['english'][0]['text']]
              new_blocks.append(block)
          new_blocks.extend(block for block in section['blocks'] if block['type']=='asset')
          section['blocks']=new_blocks
          for asset in stress.get('assets',[]):
              asset['title_en']=asset['title_en']+' — extended descriptive title for layout stress testing'
              asset['title_zh']=asset['title_zh']+'——用于布局压力测试的扩展描述性标题'
              asset['intro']=(asset['intro']+' 该说明增加内容密度，但所有卡片结构和控件位置必须保持固定。')*2
              if asset.get('kind')=='table':
                  rows=asset.setdefault('table',{}).setdefault('rows',[])
                  exemplar=rows[0] if rows else ['Variable','Value']
                  asset['table']['rows']=[list(exemplar) for _ in range(80)]
          stress['references']=[{'id':str(i),'text':f'Author {i}. Reference title {i}. Journal {i}; 2026; 1:1-10.'} for i in range(1,121)]
          pathlib.Path('.build/v082/stress/STRESS_MANIFEST.json').write_text(json.dumps(stress,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY

      - name: Render baseline and stress readers from the same committed shell
        run: |
          SHELL=templates/v082/V082_CANVAS_FROZEN_SHELL.html
          BASE=tests/fixtures/v082_shell_smoke_manifest.json
          STRESS=.build/v082/stress/STRESS_MANIFEST.json
          python tools/render_v082_from_frozen_shell.py "$BASE" .build/v082/stress/BASE_READER.html \
            --shell "$SHELL" --lock config/v082_frozen_shell_lock.json \
            --schema schemas/paper_content_manifest_v082.schema.json \
            --report reports/v082-stress/BASE_RENDER.json
          python tools/render_v082_from_frozen_shell.py "$STRESS" .build/v082/stress/STRESS_READER.html \
            --shell "$SHELL" --lock config/v082_frozen_shell_lock.json \
            --schema schemas/paper_content_manifest_v082.schema.json \
            --report reports/v082-stress/STRESS_RENDER.json
          python tools/validate_v082_rendered_architecture.py .build/v082/stress/BASE_READER.html \
            --shell "$SHELL" --manifest "$BASE" --lock config/v082_frozen_shell_lock.json \
            --report reports/v082-stress/BASE_ARCHITECTURE.json
          python tools/validate_v082_rendered_architecture.py .build/v082/stress/STRESS_READER.html \
            --shell "$SHELL" --manifest "$STRESS" --lock config/v082_frozen_shell_lock.json \
            --report reports/v082-stress/STRESS_ARCHITECTURE.json

      - name: Prove browser-level layout and color invariance
        run: |
          python tools/browser_layout_invariance_v082_v2.py \
            .build/v082/stress/BASE_READER.html \
            .build/v082/stress/STRESS_READER.html \
            --root . \
            --report reports/v082-stress/LAYOUT_INVARIANCE.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-product-shell-stress-audit
          path: |
            reports/v082-stress
            .build/v082/stress/BASE_READER.html
            .build/v082/stress/STRESS_READER.html
            .build/v082/stress/STRESS_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
