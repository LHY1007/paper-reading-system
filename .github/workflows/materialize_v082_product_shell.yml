name: Materialize immutable V0.8.2 product shell

on:
  push:
    branches: [v0.8x-batch-diagnosis]
    paths:
      - ".github/workflows/materialize_v082_product_shell.yml"
      - "00_V0.8.2_CANVAS*.html"
      - "config/v082_frozen_shell_lock.json"
      - "tools/normalize_v082_canvas_master.py"
      - "tools/freeze_v082_canvas_shell*.py"
      - "tools/validate_v082_frozen_shell.py"
      - "tools/validate_v082_canvas_shell_lock*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v082-materialize-product-shell
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic shell dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema lxml

      - name: Build, lock and materialize the product shell
        shell: bash
        run: |
          set -euo pipefail
          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          test -n "$CANVAS"
          mkdir -p .build/v082/materialized-shell templates/v082 reports/v082-materialized-shell
          MASTER=.build/v082/materialized-shell/00_CANVAS_NORMALIZED.html
          GENERATED=.build/v082/materialized-shell/V082_CANVAS_FROZEN_SHELL.html
          COMMITTED=templates/v082/V082_CANVAS_FROZEN_SHELL.html
          python tools/normalize_v082_canvas_master.py "$CANVAS" "$MASTER" \
            --report reports/v082-materialized-shell/NORMALIZED_MASTER.json
          python tools/freeze_v082_canvas_shell_v2.py "$MASTER" "$GENERATED" \
            --report reports/v082-materialized-shell/FROZEN_SHELL_BUILD.json
          python tools/validate_v082_frozen_shell.py "$GENERATED" \
            --master "$MASTER" \
            --lock config/v082_frozen_shell_lock.json \
            --report reports/v082-materialized-shell/FROZEN_SHELL_GATE.json
          cp "$GENERATED" "$COMMITTED"
          python tools/validate_v082_frozen_shell.py "$COMMITTED" \
            --master "$MASTER" \
            --lock config/v082_frozen_shell_lock.json \
            --report reports/v082-materialized-shell/MATERIALIZED_SHELL_GATE.json

      - name: Commit the immutable shell only when bytes changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/v082/V082_CANVAS_FROZEN_SHELL.html
          if git diff --cached --quiet; then
            echo "Materialized shell already matches the immutable lock"
            exit 0
          fi
          git commit -m "Materialize immutable V0.8.2 CANVAS product shell"
          git fetch origin v0.8x-batch-diagnosis
          git rebase origin/v0.8x-batch-diagnosis
          git push origin HEAD:v0.8x-batch-diagnosis

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-materialized-product-shell-audit
          path: |
            templates/v082/V082_CANVAS_FROZEN_SHELL.html
            reports/v082-materialized-shell
          if-no-files-found: error
          retention-days: 30
