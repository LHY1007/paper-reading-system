name: Build V0.8.2 candidate

on:
  push:
    branches: [v0.8.2-candidate]
    paths:
      - "releases/V0.8.2/build_trigger.txt"
      - "releases/V0.8.2/build.py"
      - "releases/V0.8.2/source/patch_chunks/**"
      - "releases/V0.8.2/validators/validate.py"
      - ".github/workflows/build_v082_candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8.2-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build candidate from locked V0.8.1
        run: python releases/V0.8.2/build.py
      - name: Validate candidate contract
        run: |
          python releases/V0.8.2/validators/validate.py \
            published/V0.8.2_CANVAS_Cellular_architecture_and_neighborhood-informed_virtual_spatial_tumor_profiling.html \
            --sha256 84c37e235f40e782c79de6625ddd9369cba64095f28bff75ae702fb5893f6ff1
      - name: Commit candidate artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/V0.8.2_CANVAS_Cellular_architecture_and_neighborhood-informed_virtual_spatial_tumor_profiling.html
          if git diff --cached --quiet; then
            echo "Candidate artifact already current"
          else
            git commit -m "Build V0.8.2 CANVAS candidate HTML"
            git push origin HEAD:v0.8.2-candidate
          fi
