name: Regenerate V0.8.2 HTML outputs

on:
  push:
    branches:
      - v0.8x-batch-diagnosis
    paths:
      - .github/v082-regenerate-html-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v082-regenerate-html
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic renderer dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 jsonschema lxml

      - name: Render every available manifest through the frozen shell
        shell: bash
        run: |
          set -euo pipefail
          OUT=.build/v082-regenerated
          HTML="$OUT/html"
          REPORTS="$OUT/reports"
          mkdir -p "$HTML" "$REPORTS"

          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | sort | head -n 1)
          test -n "$CANVAS"
          cp "$CANVAS" "$HTML/00_CANVAS.html"

          count=0
          for manifest in $(find content/v082_manifests -maxdepth 1 -type f -name '*.json' | sort); do
            key=$(basename "$manifest" .json)
            output="$HTML/${key}.html"
            python tools/validate_v082_manifest_code_boundary.py "$manifest" \
              --report "$REPORTS/${key}_MANIFEST_CODE_BOUNDARY.json"
            python tools/render_v082_from_frozen_shell.py "$manifest" "$output" \
              --shell templates/v082/V082_CANVAS_FROZEN_SHELL.html \
              --lock config/v082_frozen_shell_lock.json \
              --schema schemas/paper_content_manifest_v082.schema.json \
              --report "$REPORTS/${key}_RENDER.json"
            python tools/validate_v082_rendered_architecture.py "$output" \
              --shell templates/v082/V082_CANVAS_FROZEN_SHELL.html \
              --manifest "$manifest" \
              --lock config/v082_frozen_shell_lock.json \
              --report "$REPORTS/${key}_ARCHITECTURE.json"
            count=$((count + 1))
          done

          test "$count" -gt 0
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.build/v082-regenerated')
          html = sorted((root / 'html').glob('*.html'))
          summary = {
              'passed': True,
              'html_count': len(html),
              'files': [
                  {
                      'name': p.name,
                      'bytes': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
                  for p in html
              ],
          }
          (root / 'REGENERATION_SUMMARY.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Package regenerated HTML files
        run: |
          cd .build/v082-regenerated
          zip -9 -r ../V0.8.2_REGENERATED_HTML.zip html reports REGENERATION_SUMMARY.json

      - uses: actions/upload-artifact@v4
        with:
          name: v082-regenerated-html
          path: |
            .build/V0.8.2_REGENERATED_HTML.zip
            .build/v082-regenerated
          if-no-files-found: error
          retention-days: 30
