name: Build V0.8.2 Maas source-grounded scaffold

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test_v082_copilot_sdk.yml"
      - "tools/generate_v082_reader_manifest_with_google_translate_v12.py"
      - "tools/generate_v082_reader_manifest_with_google_translate_v11.py"
      - "config/v082_reader_content_plans/maas-2026.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and translation dependencies
        run: |
          pip install --disable-pip-version-check requests beautifulsoup4 PyMuPDF curl_cffi jsonschema lxml pillow
      - name: Restore audited source PDF cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/download_v082_release_sources_continue.py', 'tools/prefetch_v082_blocked_sources.py') }}
          restore-keys: |
            v082-source-pdfs-
      - name: Build exact Maas evidence
        run: |
          set -euo pipefail
          mkdir -p .build/v082/maas-scaffold/reports .build/v082/model-cache
          test -s .build/v082/pdfs/01_maas-2026.pdf
          python tools/build_pdf_native_manifest_v082.py \
            .build/v082/pdfs/01_maas-2026.pdf \
            .build/v082/maas-scaffold/evidence.json \
            --registry config/v082_paper_sources.json \
            --key maas-2026 \
            --audit .build/v082/maas-scaffold/evidence-audit.json
          python tools/validate_v082_evidence_quality_v5.py \
            .build/v082/maas-scaffold/evidence.json \
            --audit .build/v082/maas-scaffold/evidence-audit.json \
            --report .build/v082/maas-scaffold/reports/EVIDENCE_QUALITY.json
      - name: Translate and assemble deterministic scaffold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V082_TRANSLATE_INTERVAL_SECONDS: "0.08"
        run: |
          set -euo pipefail
          python tools/generate_v082_reader_manifest_with_google_translate_v12.py \
            .build/v082/maas-scaffold/evidence.json \
            config/v082_reader_content_plans/maas-2026.json \
            .build/v082/maas-scaffold/manifest.json \
            --cache-dir .build/v082/model-cache
          python tools/normalize_v082_paper_tables.py \
            .build/v082/maas-scaffold/manifest.json \
            .build/v082/maas-scaffold/manifest.normalized.json
          mv .build/v082/maas-scaffold/manifest.normalized.json .build/v082/maas-scaffold/manifest.json
      - name: Run all deterministic manifest audits
        if: always()
        run: |
          set +e
          python tools/validate_v082_final_manifest.py \
            .build/v082/maas-scaffold/manifest.json \
            .build/v082/maas-scaffold/evidence.json \
            --schema schemas/paper_content_manifest_v082.schema.json \
            --report .build/v082/maas-scaffold/reports/FINAL_MANIFEST.json
          python tools/validate_v082_manifest_code_boundary.py \
            .build/v082/maas-scaffold/manifest.json \
            --report .build/v082/maas-scaffold/reports/CODE_BOUNDARY.json
          python tools/validate_v082_reader_semantics_v4.py \
            .build/v082/maas-scaffold/evidence.json \
            .build/v082/maas-scaffold/manifest.json \
            --report .build/v082/maas-scaffold/reports/SEMANTIC_GROUNDING.json
          python tools/validate_v082_reader_content_quality.py \
            .build/v082/maas-scaffold/manifest.json \
            --report .build/v082/maas-scaffold/reports/READER_CONTENT.json
          exit 0
      - name: Upload Maas scaffold and complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v082-maas-source-grounded-scaffold
          path: .build/v082/maas-scaffold
          include-hidden-files: true
          retention-days: 30
