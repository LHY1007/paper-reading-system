name: Test V0.8.2 model providers

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test_v082_copilot_sdk.yml"
      - "tools/copilot_sdk_json_provider.py"
      - "tools/copilot_sdk_json_provider_v2.py"
      - "tools/generate_v082_reader_manifest_with_github_models.py"
      - "tools/generate_v082_reader_manifest_with_github_models_v4.py"
      - "tools/test_copilot_json_provider.py"
  workflow_dispatch:

permissions:
  contents: read
  models: read
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check github-copilot-sdk json-repair
      - name: Validate deterministic malformed-JSON and idle-timeout recovery
        run: python tools/test_copilot_json_provider.py
      - name: Send isolated GitHub Models strict-JSON request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MIN_INTERVAL_SECONDS: "0"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.generate_v082_reader_manifest_with_github_models_v4 import base

          result = base.call_model_json(
              token=os.environ['GITHUB_TOKEN'],
              model='openai/gpt-5',
              system='Return the integer sum in strict JSON: {"sum": integer}.',
              user_payload={'a': 19, 'b': 23},
              cache_dir=Path('.build/github-models-smoke'),
              cache_name='sum',
              max_tokens=2000,
              retries=2,
          )
          assert result == {'sum': 42}, result
          print(result)
          PY
