name: Generate V0.8.2 Lee reader manifest

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generate_v082_reader_manifest_lee.yml"
      - "tools/generate_v082_reader_manifest_with_github_models*.py"
      - "tools/build_pdf_native_manifest_v082*.py"
      - "tools/v082_body_reconstruction*.py"
      - "tools/validate_v082_evidence_quality*.py"
      - "config/v082_reader_content_plans/lee-2025.json"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: v082-generate-lee-reader-manifest
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  GITHUB_MODELS_MODEL: "openai/gpt-4.1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evidence and manifest dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 PyMuPDF curl_cffi jsonschema lxml pillow

      - name: Restore GitHub Models response cache
        uses: actions/cache@v4
        with:
          path: .build/v082/model-cache
          key: v082-model-cache-lee-${{ hashFiles('tools/generate_v082_reader_manifest_with_github_models*.py', 'config/v082_reader_content_plans/lee-2025.json') }}
          restore-keys: |
            v082-model-cache-lee-

      - name: Prepare the exact Lee source registry
        run: |
          mkdir -p .build/v082/{pdfs,evidence,audits,reports} content/v082_manifests
          python - <<'PY'
          import json, pathlib
          source=json.load(open('config/v082_paper_sources.json'))
          paper=next(item for item in source['papers'] if item['key']=='lee-2025')
          subset={**source,'version':source['version']+'-lee-manifest','papers':[paper]}
          pathlib.Path('.build/v082/lee-registry.json').write_text(json.dumps(subset,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY

      - name: Download and verify the exact source PDF
        run: |
          python tools/download_v082_sources.py \
            --registry .build/v082/lee-registry.json \
            --output-dir .build/v082/pdfs \
            --report .build/v082/reports/LEE_SOURCE.json

      - name: Build and validate source evidence
        run: |
          PDF=.build/v082/pdfs/03_lee-2025.pdf
          EVIDENCE=.build/v082/evidence/lee-2025.json
          AUDIT=.build/v082/audits/lee-2025.json
          python tools/build_pdf_native_manifest_v082.py "$PDF" "$EVIDENCE" \
            --registry .build/v082/lee-registry.json --key lee-2025 --audit "$AUDIT"
          python tools/validate_v082_evidence_quality_v5.py "$EVIDENCE" \
            --audit "$AUDIT" --report .build/v082/reports/LEE_EVIDENCE_QUALITY.json

      - name: Generate the complete bilingual manifest with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/generate_v082_reader_manifest_with_github_models_v2.py \
            .build/v082/evidence/lee-2025.json \
            config/v082_reader_content_plans/lee-2025.json \
            content/v082_manifests/lee-2025.json \
            --cache-dir .build/v082/model-cache

      - name: Enforce all reader-content gates
        run: |
          MANIFEST=content/v082_manifests/lee-2025.json
          AUDIT=.build/v082/audits/lee-2025.json
          python tools/validate_v082_reader_content_quality.py "$MANIFEST" \
            --report .build/v082/reports/LEE_READER_CONTENT.json
          python tools/validate_v082_final_manifest.py "$MANIFEST" \
            --schema schemas/paper_content_manifest_v082.schema.json \
            --audit "$AUDIT" --report .build/v082/reports/LEE_FINAL_MANIFEST.json
          python tools/validate_v082_manifest_code_boundary.py "$MANIFEST" \
            --report .build/v082/reports/LEE_CODE_BOUNDARY.json

      - name: Commit only a fully validated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/v082_manifests/lee-2025.json
          if git diff --cached --quiet; then
            echo "Lee manifest already current"
          else
            git commit -m "Add validated V0.8.2 Lee bilingual reader manifest"
            git push origin HEAD:v0.8x-batch-diagnosis
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-lee-reader-manifest-audit
          path: |
            content/v082_manifests/lee-2025.json
            .build/v082/evidence/lee-2025.json
            .build/v082/audits/lee-2025.json
            .build/v082/reports
          if-no-files-found: warn
          retention-days: 30
