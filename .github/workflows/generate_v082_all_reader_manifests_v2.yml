name: Generate all V0.8.2 manifests strictly sequentially

on:
  push:
    branches: [v0.8x-batch-diagnosis]
    paths:
      - ".github/v082-manifest-trigger-v11"
      - ".github/workflows/generate_v082_all_reader_manifests_v2.yml"
      - "tools/generate_v082_reader_manifest_with_google_translate_v11.py"
      - "config/v082_reader_content_plans/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v082-generate-pr-v11-observable
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  V082_TRANSLATE_INTERVAL_SECONDS: "0.05"
  CHO_CACHE_KEY: "v082-cho-source-adz2742-24p-branch-v1"
  CHO_ADOBE_PREVIEW_URL: "https://to.adobe.com/phMsfMA7YPzZqvAdG8hYM4vE9jVf"

jobs:
  generate-strictly-sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - name: Record active workflow run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p status
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('status/v082_generation_status.json').write_text(json.dumps({
              'version': 'v082-generation-observer-2',
              'state': 'running',
              'generator': 'v11-batched-google-translate',
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'trigger_sha': os.environ['HEAD_SHA'],
          }, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/v082_generation_status.json
          git commit -m "Record active V0.8.2 v11 manifest run ${RUN_ID}" || true
          git fetch origin v0.8x-batch-diagnosis
          git rebase origin/v0.8x-batch-diagnosis
          git push origin HEAD:v0.8x-batch-diagnosis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source, evidence and manifest dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 PyMuPDF curl_cffi jsonschema lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Locate immutable CANVAS reader and prepare directories
        run: |
          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          test -n "$CANVAS"
          printf 'CANVAS_ORIGINAL=%q\n' "$CANVAS" > /tmp/v082_manifest_paths
          mkdir -p .build/v082/{pdfs,cho-source,science-prefetch,batch-evidence,batch-audits,batch-reports,generated-manifests,model-cache} content/v082_manifests

      - name: Restore audited PDF cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/download_v082_release_sources_continue.py', 'tools/prefetch_v082_blocked_sources.py') }}
          restore-keys: |
            v082-source-pdfs-

      - name: Restore dedicated user-supplied Cho source cache
        id: cho-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/cho-source
          key: ${{ env.CHO_CACHE_KEY }}

      - name: Materialize and inject validated Cho source
        run: |
          if [ ! -f .build/v082/cho-source/07_cho-2026.pdf ]; then
            python tools/prefetch_v082_adobe_shared_pdf.py \
              --url "$CHO_ADOBE_PREVIEW_URL" \
              --output .build/v082/cho-source/07_cho-2026.pdf \
              --report .build/v082/science-prefetch/CHO_SOURCE_FINAL.json \
              --expected-pages 24 \
              --doi 10.1126/science.adz2742 \
              --title-fragment "Pan-cancer spatial atlas of tertiary lymphoid structures"
          fi
          test -s .build/v082/cho-source/07_cho-2026.pdf
          cp .build/v082/cho-source/07_cho-2026.pdf .build/v082/pdfs/07_cho-2026.pdf

      - name: Save dedicated Cho source cache
        if: steps.cho-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/cho-source
          key: ${{ env.CHO_CACHE_KEY }}

      - name: Restore translation caches
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/model-cache
          key: v082-google-translation-v11-${{ hashFiles('tools/generate_v082_reader_manifest_with_google_translate_v11.py', 'config/v082_reader_content_plans/*.json') }}
          restore-keys: |
            v082-google-translation-v11-
            v082-google-translation-v10-
            v082-google-translation-v9-
            v082-google-translation-v8-

      - name: Obtain every exact source PDF
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_manifest_paths
          python tools/prefetch_v082_blocked_sources.py \
            --registry config/v082_paper_sources.json \
            --output-dir .build/v082/pdfs \
            --report .build/v082/batch-reports/BLOCKED_SOURCE_PREFETCH.json || true
          python tools/download_v082_release_sources_continue.py \
            --registry config/v082_paper_sources.json \
            --canonical-html "$CANVAS_ORIGINAL" \
            --output-dir .build/v082/pdfs \
            --report .build/v082/batch-reports/SOURCE_DOWNLOAD_AVAILABLE.json \
            --reuse || true

      - name: Generate, gate and persist one paper at a time
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/run_v082_manifest_generation_sequentially_v2.py \
            --registry config/v082_paper_sources.json \
            --pdf-dir .build/v082/pdfs \
            --evidence-dir .build/v082/batch-evidence \
            --audit-dir .build/v082/batch-audits \
            --report-dir .build/v082/batch-reports \
            --generated-dir .build/v082/generated-manifests \
            --manifest-dir content/v082_manifests \
            --plans-dir config/v082_reader_content_plans \
            --cache-dir .build/v082/model-cache \
            --generator tools/generate_v082_reader_manifest_with_google_translate_v11.py \
            --branch v0.8x-batch-diagnosis

      - name: Save rolling exact-source cache
        if: always() && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/pdfs
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - name: Save translation caches after every attempt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build/v082/model-cache
          key: v082-google-translation-v11-run-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-strict-sequential-manifest-audit-v11
          path: |
            content/v082_manifests
            .build/v082/science-prefetch
            .build/v082/batch-evidence
            .build/v082/batch-audits
            .build/v082/batch-reports
            .build/v082/generated-manifests
            .build/v082/model-cache
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Record terminal workflow state
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifests = sorted(path.stem for path in Path('content/v082_manifests').glob('*.json'))
          summary_path = Path('.build/v082/batch-reports/SEQUENTIAL_MANIFEST_GENERATION.json')
          summary = json.loads(summary_path.read_text('utf-8')) if summary_path.exists() else None
          Path('status/v082_generation_status.json').write_text(json.dumps({
              'version': 'v082-generation-observer-2',
              'state': 'completed',
              'generator': 'v11-batched-google-translate',
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'generation_outcome': os.environ.get('GENERATION_OUTCOME'),
              'manifest_count': len(manifests),
              'manifests': manifests,
              'summary': summary,
          }, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/v082_generation_status.json
          git commit -m "Record V0.8.2 v11 manifest run ${RUN_ID} outcome" || true
          git fetch origin v0.8x-batch-diagnosis
          git rebase origin/v0.8x-batch-diagnosis
          git push origin HEAD:v0.8x-batch-diagnosis
