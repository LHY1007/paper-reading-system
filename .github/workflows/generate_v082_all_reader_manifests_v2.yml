name: Generate all V0.8.2 manifests by sequential strong-AI review

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/v082-manifest-trigger-v14"
      - ".github/workflows/generate_v082_all_reader_manifests_v2.yml"
      - ".github/workflows/generate_v082_one_paper_strong.yml"
      - "tools/copilot_sdk_json_provider.py"
      - "tools/generate_v082_reader_manifest_with_copilot_sdk_v14.py"
      - "tools/generate_v082_reader_manifest_with_strong_ai_v13.py"
      - "tools/run_v082_manifest_generation_one_strong.py"
      - "tools/validate_v082_strong_ai_review.py"
      - "tools/validate_v082_reader_semantics_v4.py"
      - "config/v082_reader_content_plans/*.json"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: v082-strong-ai-v14-strict-sequence
  cancel-in-progress: true

jobs:
  maas:
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: maas-2026
    secrets: inherit

  landry:
    needs: maas
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: landry-2026
    secrets: inherit

  lee:
    needs: landry
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: lee-2025
    secrets: inherit

  valanarasu:
    needs: lee
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: valanarasu-2026
    secrets: inherit

  li_hex:
    needs: valanarasu
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: li-hex-2026
    secrets: inherit

  andani:
    needs: li_hex
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: andani-2025
    secrets: inherit

  cho:
    needs: andani
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: cho-2026
    secrets: inherit

  spitzer:
    needs: cho
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: spitzer-2025
    secrets: inherit

  lucas:
    needs: spitzer
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: lucas-2024
    secrets: inherit

  sorin:
    needs: lucas
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: sorin-2023
    secrets: inherit

  karimi:
    needs: sorin
    uses: ./.github/workflows/generate_v082_one_paper_strong.yml
    with:
      paper_key: karimi-2023
    secrets: inherit

  complete:
    needs: karimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0
      - name: Verify all reviewed manifests exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('config/v082_paper_sources.json').read_text('utf-8'))
          keys = [p['key'] for p in registry['papers'] if int(p['order']) != 0]
          missing = []
          for key in keys:
              if not Path(f'content/v082_manifests/{key}.json').exists():
                  missing.append(f'manifest:{key}')
              if not Path(f'content/v082_reviews/{key}.json').exists():
                  missing.append(f'review:{key}')
          if missing:
              raise SystemExit('missing reviewed outputs: ' + ', '.join(missing))
          if any(not json.loads(Path(f'content/v082_reviews/{key}.json').read_text('utf-8')).get('passed') for key in keys):
              raise SystemExit('one or more persisted strong-AI reviews did not pass')
          print(json.dumps({'reviewed_papers': len(keys), 'passed': True}, indent=2))
          PY
