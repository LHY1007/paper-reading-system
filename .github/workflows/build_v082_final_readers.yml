name: Build V0.8.2 final readers

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build_v082_final_readers.yml"
      - "config/v082_paper_sources.json"
      - "config/biomedical_glossary_zh.json"
      - "schemas/paper_content_manifest_v082.schema.json"
      - "tools/download_v082_sources.py"
      - "tools/download_v082_release_sources.py"
      - "tools/build_pdf_native_manifest_v082.py"
      - "tools/build_pdf_native_manifest_v082_unpacked.py"
      - "tools/build_pdf_native_manifest_v082_final.py"
      - "tools/translate_v082_manifest.py"
      - "tools/validate_v082_final_manifest.py"
      - "tools/normalize_v082_canvas_master.py"
      - "tools/render_v082_canvas_component_locked*.py"
      - "tools/validate_v082_canvas_shell_lock*.py"
      - "tools/validate_v082_canvas_components*.py"
      - "tools/browser_regression_v082.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v082-final-reader-build
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_XET: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  final-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-zh-v1

      - name: Install build and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            beautifulsoup4 jsonschema requests lxml pillow PyMuPDF \
            transformers sentencepiece sacremoses playwright
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium

      - name: Locate immutable CANVAS source
        shell: bash
        run: |
          set -euo pipefail
          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          test -n "$CANVAS"
          printf 'CANVAS_ORIGINAL=%q\n' "$CANVAS" > /tmp/v082_final_paths

      - name: Audit CANVAS baseline and download non-CANVAS source PDFs
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          mkdir -p .build/v082/pdfs final/V0.8.2/reports
          python tools/download_v082_release_sources.py \
            --registry config/v082_paper_sources.json \
            --canonical-html "$CANVAS_ORIGINAL" \
            --output-dir .build/v082/pdfs \
            --report final/V0.8.2/reports/SOURCE_DOWNLOAD.json

      - name: Build normalized canonical final reader
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          mkdir -p final/V0.8.2/readers final/V0.8.2/manifests final/V0.8.2/audits final/V0.8.2/reports final/V0.8.2/cache
          MASTER=$(python - <<'PY'
          import json
          r=json.load(open('config/v082_paper_sources.json'))
          print('final/V0.8.2/readers/'+next(x['output'] for x in r['papers'] if x['order']==0))
          PY
          )
          python tools/normalize_v082_canvas_master.py "$CANVAS_ORIGINAL" "$MASTER" --report final/V0.8.2/reports/NORMALIZED_MASTER.json
          python tools/validate_v082_canvas_shell_lock.py "$MASTER" --canonical "$MASTER" --report final/V0.8.2/reports/00_CANVAS_SHELL.json
          python tools/validate_v082_canvas_components.py "$MASTER" --report final/V0.8.2/reports/00_CANVAS_COMPONENTS.json
          python tools/validate_reader_content_coverage.py "$MASTER" --baseline "$CANVAS_ORIGINAL" --report final/V0.8.2/reports/00_CANVAS_CONTENT.json
          printf 'MASTER=%q\n' "$MASTER" >> /tmp/v082_final_paths

      - name: Sequentially build every non-CANVAS paper
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          python - <<'PY'
          import json, pathlib, subprocess, sys

          root=pathlib.Path('.')
          registry=json.loads((root/'config/v082_paper_sources.json').read_text('utf-8'))
          schema=root/'schemas/paper_content_manifest_v082.schema.json'
          glossary=root/'config/biomedical_glossary_zh.json'
          cache=root/'final/V0.8.2/cache/opus-mt-en-zh.json'
          master=next((root/'final/V0.8.2/readers').glob('00_V0.8.2_FINAL_CANVAS*.html'))
          raw_dir=root/'.build/v082/manifests_raw'
          raw_dir.mkdir(parents=True,exist_ok=True)
          final_manifest_dir=root/'final/V0.8.2/manifests'
          audit_dir=root/'final/V0.8.2/audits'
          report_dir=root/'final/V0.8.2/reports'
          reader_dir=root/'final/V0.8.2/readers'
          for paper in sorted(registry['papers'],key=lambda x:x['order']):
              if paper['order']==0:
                  continue
              key=paper['key']
              pdf=root/'.build/v082/pdfs'/f"{paper['order']:02d}_{key}.pdf"
              raw=raw_dir/f'{key}.json'
              manifest=final_manifest_dir/f'{key}.json'
              audit=audit_dir/f'{key}.json'
              content_report=report_dir/f'{paper["order"]:02d}_{key}_CONTENT.json'
              output=reader_dir/paper['output']
              shell_report=report_dir/f'{paper["order"]:02d}_{key}_SHELL.json'
              component_report=report_dir/f'{paper["order"]:02d}_{key}_COMPONENTS.json'
              print(f'\n===== BUILD {paper["order"]:02d} {key} =====',flush=True)
              subprocess.run([sys.executable,'tools/build_pdf_native_manifest_v082.py',str(pdf),str(raw),'--registry','config/v082_paper_sources.json','--key',key,'--audit',str(audit)],check=True)
              subprocess.run([sys.executable,'tools/translate_v082_manifest.py',str(raw),str(manifest),'--glossary',str(glossary),'--cache',str(cache),'--batch-size','16'],check=True)
              subprocess.run([sys.executable,'tools/validate_v082_final_manifest.py',str(manifest),'--schema',str(schema),'--audit',str(audit),'--report',str(content_report)],check=True)
              subprocess.run([sys.executable,'tools/render_v082_canvas_component_locked_v2.py',str(manifest),str(output),'--canonical',str(master),'--schema',str(schema)],check=True)
              subprocess.run([sys.executable,'tools/validate_v082_canvas_shell_lock.py',str(output),'--canonical',str(master),'--report',str(shell_report)],check=True)
              subprocess.run([sys.executable,'tools/validate_v082_canvas_components.py',str(output),'--report',str(component_report)],check=True)
          PY

      - name: Run strict browser regression across all 12 readers
        run: |
          set -euo pipefail
          mapfile -t READERS < <(find final/V0.8.2/readers -maxdepth 1 -name '*.html' -print | sort)
          test "${#READERS[@]}" -eq 12
          python tools/browser_regression_v082.py "${READERS[@]}" \
            --root . \
            --report final/V0.8.2/reports/BROWSER_REGRESSION.json

      - name: Aggregate immutable final release gate
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('final/V0.8.2')
          registry=json.load(open('config/v082_paper_sources.json'))
          expected=[x['output'] for x in sorted(registry['papers'],key=lambda x:x['order'])]
          readers=sorted((root/'readers').glob('*.html'))
          content=[]; shells=[]; components=[]
          for p in sorted((root/'reports').glob('*_CONTENT.json')):
              content.append({'report':p.name,**json.loads(p.read_text('utf-8'))})
          for p in sorted((root/'reports').glob('*_SHELL.json')):
              shells.append({'report':p.name,**json.loads(p.read_text('utf-8'))})
          for p in sorted((root/'reports').glob('*_COMPONENTS.json')):
              components.append({'report':p.name,**json.loads(p.read_text('utf-8'))})
          browser=json.loads((root/'reports/BROWSER_REGRESSION.json').read_text('utf-8'))
          sources=json.loads((root/'reports/SOURCE_DOWNLOAD.json').read_text('utf-8'))
          inventory=[]
          for p in readers:
              inventory.append({'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          errors=[]
          actual=[p.name for p in readers]
          if actual!=expected: errors.append({'reader_inventory':{'expected':expected,'actual':actual}})
          if not sources.get('passed'): errors.append('source input audit gate failed')
          if len(content)!=12 or not all(x.get('passed') for x in content): errors.append('content gate failed')
          if len(shells)!=12 or not all(x.get('passed') for x in shells): errors.append('shell-lock gate failed')
          if len(components)!=12 or not all(x.get('passed') for x in components): errors.append('component-contract gate failed')
          if not browser.get('passed') or len(browser.get('files',[]))!=12: errors.append('browser regression gate failed')
          gate={
              'release':'V0.8.2 FINAL',
              'registry_version':registry['version'],
              'reader_count':len(readers),
              'inventory':inventory,
              'source_input_audit_passed':sources.get('passed'),
              'content_reports':content,
              'shell_reports':shells,
              'component_reports':components,
              'browser_regression':browser,
              'errors':errors,
              'passed':not errors,
          }
          (root/'reports/FINAL_RELEASE_GATE.json').write_text(json.dumps(gate,ensure_ascii=False,indent=2)+'\n','utf-8')
          (root/'RELEASE_INDEX.json').write_text(json.dumps({'release':'V0.8.2 FINAL','passed':not errors,'readers':inventory},ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps({'passed':not errors,'reader_count':len(readers),'errors':errors},ensure_ascii=False,indent=2))
          if errors: sys.exit(1)
          PY

      - name: Package final release
        run: |
          mkdir -p .build/release
          zip -9 -r .build/release/V0.8.2_FINAL_READERS.zip final/V0.8.2 \
            -x 'final/V0.8.2/cache/*'

      - uses: actions/upload-artifact@v4
        with:
          name: v082-final-readers
          path: |
            .build/release/V0.8.2_FINAL_READERS.zip
            final/V0.8.2
          if-no-files-found: error
          retention-days: 30

      - name: Stage final branch snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/V0.8.2
          if git diff --cached --quiet; then
            echo "Final release snapshot already current"
          else
            git commit -m "Build complete V0.8.2 final paper readers"
            git push origin HEAD:v0.8x-batch-diagnosis
          fi
