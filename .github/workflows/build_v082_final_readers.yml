name: Build V0.8.2 final readers

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build_v082_final_readers.yml"
      - "config/v082_paper_sources.json"
      - "config/v082_frozen_shell_lock.json"
      - "config/v082_reader_content_blueprint.json"
      - "config/v082_reader_content_plans/**"
      - "content/v082_manifests/**"
      - "schemas/paper_content_manifest_v082.schema.json"
      - "tools/download_v082_sources.py"
      - "tools/download_v082_release_sources.py"
      - "tools/prefetch_v082_blocked_sources.py"
      - "tools/build_pdf_native_manifest_v082*.py"
      - "tools/build_v082_reader_content_task.py"
      - "tools/build_v082_reader_if_ready*.py"
      - "tools/audit_v082_reader_experience*.py"
      - "tools/validate_v082_final_manifest.py"
      - "tools/validate_v082_reader_content_quality.py"
      - "tools/validate_v082_manifest_code_boundary.py"
      - "tools/validate_v082_rendered_architecture.py"
      - "tools/normalize_v082_canvas_master.py"
      - "tools/freeze_v082_canvas_shell*.py"
      - "tools/render_v082_from_frozen_shell.py"
      - "tools/render_v082_canvas_component_locked*.py"
      - "tools/validate_v082_frozen_shell.py"
      - "tools/validate_v082_canvas_shell_lock*.py"
      - "tools/validate_v082_canvas_components*.py"
      - "tools/browser_regression_v082.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v082-final-reader-build
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  final-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source, manifest and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 PyMuPDF curl_cffi jsonschema lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Locate immutable original CANVAS reader
        shell: bash
        run: |
          set -euo pipefail
          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          test -n "$CANVAS"
          printf 'CANVAS_ORIGINAL=%q\n' "$CANVAS" > /tmp/v082_final_paths

      - name: Reset generated release workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/v082/final-evidence
          rm -rf final/V0.8.2/readers final/V0.8.2/manifests final/V0.8.2/tasks
          mkdir -p \
            .build/v082/pdfs \
            .build/v082/templates \
            .build/v082/final-evidence \
            final/V0.8.2/readers \
            final/V0.8.2/manifests \
            final/V0.8.2/tasks \
            final/V0.8.2/audits \
            final/V0.8.2/reports

      - name: Restore audited source PDF cache
        id: source_pdf_cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/prefetch_v082_blocked_sources.py') }}
          restore-keys: |
            v082-source-pdfs-

      - name: Prefetch publisher-blocked official PDFs
        id: blocked_source_prefetch
        continue-on-error: true
        run: |
          python tools/prefetch_v082_blocked_sources.py \
            --registry config/v082_paper_sources.json \
            --output-dir .build/v082/pdfs \
            --report final/V0.8.2/reports/BLOCKED_SOURCE_PREFETCH.json

      - name: Audit CANVAS baseline and obtain exact non-CANVAS sources
        id: source_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          python tools/download_v082_release_sources.py \
            --registry config/v082_paper_sources.json \
            --canonical-html "$CANVAS_ORIGINAL" \
            --output-dir .build/v082/pdfs \
            --report final/V0.8.2/reports/SOURCE_DOWNLOAD.json \
            --reuse

      - name: Save rolling exact-source cache
        if: always() && steps.source_pdf_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/prefetch_v082_blocked_sources.py') }}

      - name: Build original CANVAS baseline and immutable product shell
        if: steps.source_audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          MASTER=$(python - <<'PY'
          import json
          registry=json.load(open('config/v082_paper_sources.json'))
          print('final/V0.8.2/readers/'+next(item['output'] for item in registry['papers'] if item['order']==0))
          PY
          )
          SHELL=.build/v082/templates/V082_CANVAS_FROZEN_SHELL.html
          python tools/normalize_v082_canvas_master.py "$CANVAS_ORIGINAL" "$MASTER" \
            --report final/V0.8.2/reports/NORMALIZED_MASTER.json
          python tools/validate_v082_canvas_shell_lock.py "$MASTER" --canonical "$MASTER" \
            --report final/V0.8.2/reports/00_CANVAS_SHELL.json
          python tools/validate_v082_canvas_components.py "$MASTER" \
            --report final/V0.8.2/reports/00_CANVAS_COMPONENTS.json
          python tools/validate_reader_content_coverage.py "$MASTER" --baseline "$CANVAS_ORIGINAL" \
            --report final/V0.8.2/reports/00_CANVAS_CONTENT.json
          python tools/audit_v082_reader_experience_v2.py "$CANVAS_ORIGINAL" "$MASTER" \
            --json final/V0.8.2/reports/00_CANVAS_READER_EXPERIENCE.json \
            --md final/V0.8.2/reports/00_CANVAS_READER_EXPERIENCE.md \
            --minimum-score 30
          python tools/freeze_v082_canvas_shell_v2.py "$MASTER" "$SHELL" \
            --report final/V0.8.2/reports/FROZEN_SHELL_BUILD.json
          python tools/validate_v082_frozen_shell.py "$SHELL" --master "$MASTER" \
            --lock config/v082_frozen_shell_lock.json \
            --report final/V0.8.2/reports/FROZEN_SHELL_GATE.json
          printf 'MASTER=%q\nSHELL=%q\n' "$MASTER" "$SHELL" >> /tmp/v082_final_paths

      - name: Sequentially build each paper only from a completed reader manifest
        id: reader_build
        if: steps.source_audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          python - <<'PY'
          import json, pathlib, subprocess, sys
          root=pathlib.Path('.')
          registry=json.loads((root/'config/v082_paper_sources.json').read_text('utf-8'))
          raw_dir=root/'.build/v082/final-evidence'
          statuses=[]
          for paper in sorted(registry['papers'],key=lambda item:item['order']):
              if paper['order']==0:
                  continue
              key=paper['key']; order=paper['order']; prefix=f'{order:02d}_{key}'
              print(f'\n===== FINAL SEQUENTIAL BUILD {order:02d} {key} =====',flush=True)
              pdf=root/'.build/v082/pdfs'/f'{order:02d}_{key}.pdf'
              raw=raw_dir/f'{key}.json'
              audit=root/'final/V0.8.2/audits'/f'{key}.json'
              task=root/'final/V0.8.2/tasks'/f'{key}.json'
              manifest=root/'final/V0.8.2/manifests'/f'{key}.json'
              output=root/'final/V0.8.2/readers'/paper['output']
              status=root/'final/V0.8.2/reports'/f'{prefix}_BUILD_READINESS.json'
              parser=subprocess.run([
                  sys.executable,'tools/build_pdf_native_manifest_v082.py',str(pdf),str(raw),
                  '--registry','config/v082_paper_sources.json','--key',key,'--audit',str(audit)
              ])
              if parser.returncode != 0 or not raw.exists():
                  status.write_text(json.dumps({
                      'version':'v082-reader-build-readiness-1',
                      'paper_key':key,'rendered':False,
                      'reason':'exact PDF evidence extraction failed',
                      'parser_returncode':parser.returncode,
                  },ensure_ascii=False,indent=2)+'\n','utf-8')
                  statuses.append(json.loads(status.read_text('utf-8')))
                  break
              result=subprocess.run([
                  sys.executable,'tools/build_v082_reader_if_ready_v2.py',
                  str(raw),str(audit),key,str(output),
                  '--task-output',str(task),
                  '--manifest-output',str(manifest),
                  '--report-dir','final/V0.8.2/reports',
                  '--status-report',str(status),
                  '--schema','schemas/paper_content_manifest_v082.schema.json',
                  '--shell',str(pathlib.Path('.build/v082/templates/V082_CANVAS_FROZEN_SHELL.html')),
                  '--lock','config/v082_frozen_shell_lock.json',
                  '--master',str(next((root/'final/V0.8.2/readers').glob('00_V0.8.2_FINAL_CANVAS*.html'))),
                  '--baseline',str(next(root.glob('00_V0.8.2_CANVAS*.html')),
                  '--require-ready',
              ])
              statuses.append(json.loads(status.read_text('utf-8')))
              if result.returncode != 0 or not statuses[-1].get('rendered'):
                  break
          (root/'final/V0.8.2/reports/SEQUENTIAL_READER_BUILD.json').write_text(
              json.dumps({'version':'v082-sequential-reader-build-1','papers':statuses},ensure_ascii=False,indent=2)+'\n','utf-8'
          )
          print(json.dumps(statuses,ensure_ascii=False,indent=2))
          if len(statuses)!=11 or not all(item.get('rendered') for item in statuses):
              raise SystemExit('sequential release build stopped before all 11 non-CANVAS readers passed')
          PY

      - name: Run strict browser regression across exactly 12 valid readers
        if: steps.reader_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t READERS < <(find final/V0.8.2/readers -maxdepth 1 -name '*.html' -print | sort)
          test "${#READERS[@]}" -eq 12
          python tools/browser_regression_v082.py "${READERS[@]}" \
            --root . \
            --report final/V0.8.2/reports/BROWSER_REGRESSION.json

      - name: Aggregate final release gate
        if: steps.reader_build.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('final/V0.8.2')
          registry=json.load(open('config/v082_paper_sources.json'))
          expected=[item['output'] for item in sorted(registry['papers'],key=lambda x:x['order'])]
          readers=sorted((root/'readers').glob('*.html'))
          readiness=json.loads((root/'reports/SEQUENTIAL_READER_BUILD.json').read_text('utf-8'))
          browser=json.loads((root/'reports/BROWSER_REGRESSION.json').read_text('utf-8'))
          sources=json.loads((root/'reports/SOURCE_DOWNLOAD.json').read_text('utf-8'))
          inventory=[{
              'file':path.name,
              'bytes':path.stat().st_size,
              'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
          } for path in readers]
          errors=[]
          if [path.name for path in readers] != expected:
              errors.append({'reader_inventory':{'expected':expected,'actual':[path.name for path in readers]}})
          if not sources.get('passed'):
              errors.append('source input audit failed')
          if len(readiness.get('papers',[])) != 11 or not all(item.get('rendered') for item in readiness.get('papers',[])):
              errors.append('reader-ready manifest gate failed')
          if not browser.get('passed') or len(browser.get('files',[])) != 12:
              errors.append('browser regression failed')
          gate={
              'release':'V0.8.2 FINAL',
              'architecture':'immutable CANVAS product shell + paper-specific reader content plans + completed bilingual manifests',
              'reader_count':len(readers),
              'inventory':inventory,
              'reader_build_readiness':readiness,
              'source_input_audit':sources,
              'browser_regression':browser,
              'errors':errors,
              'passed':not errors,
          }
          (root/'reports/FINAL_RELEASE_GATE.json').write_text(json.dumps(gate,ensure_ascii=False,indent=2)+'\n','utf-8')
          (root/'RELEASE_INDEX.json').write_text(json.dumps({
              'release':'V0.8.2 FINAL','passed':not errors,'readers':inventory
          },ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps({'passed':not errors,'reader_count':len(readers),'errors':errors},ensure_ascii=False,indent=2))
          if errors:
              raise SystemExit(1)
          PY

      - name: Package final release only after the aggregate gate passes
        if: steps.reader_build.outcome == 'success'
        run: |
          mkdir -p .build/release
          zip -9 -r .build/release/V0.8.2_FINAL_READERS.zip final/V0.8.2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-final-reader-build-audit
          path: |
            final/V0.8.2
            .build/v082/final-evidence
            .build/release/V0.8.2_FINAL_READERS.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce fail-closed final status
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.source_audit.outcome }}" != "success" ]; then
            cat final/V0.8.2/reports/BLOCKED_SOURCE_PREFETCH.json || true
            cat final/V0.8.2/reports/SOURCE_DOWNLOAD.json || true
            exit 1
          fi
          if [ "${{ steps.reader_build.outcome }}" != "success" ]; then
            cat final/V0.8.2/reports/SEQUENTIAL_READER_BUILD.json || true
            find final/V0.8.2/reports -name '*_BUILD_READINESS.json' -maxdepth 1 -print -exec cat {} \;
            exit 1
          fi
          test -f final/V0.8.2/reports/FINAL_RELEASE_GATE.json
          python - <<'PY'
          import json
          gate=json.load(open('final/V0.8.2/reports/FINAL_RELEASE_GATE.json'))
          if not gate.get('passed'):
              raise SystemExit('FINAL_RELEASE_GATE.json did not pass')
          PY

      - name: Stage final branch snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/V0.8.2
          if git diff --cached --quiet; then
            echo "Final release snapshot already current"
          else
            git commit -m "Build complete V0.8.2 final paper readers"
            git push origin HEAD:v0.8x-batch-diagnosis
          fi
