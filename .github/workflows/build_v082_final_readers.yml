name: Build V0.8.2 final readers

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/v082-final-build-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v082-final-reader-build
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CHO_CACHE_KEY: "v082-cho-source-adz2742-24p-v1"
  LUCAS_CACHE_KEY: "v082-lucas-source-s41588-024-01747-1-31p-v1"

jobs:
  final-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require completed strong-AI review set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          trigger = Path('.github/v082-final-build-trigger')
          if not trigger.exists():
              raise SystemExit('final build trigger is missing')
          state = json.loads(trigger.read_text('utf-8'))
          if not state.get('all_reviewed_manifests_passed'):
              raise SystemExit('final build trigger was not armed by the complete strong-AI sequence')
          if not state.get('independent_reviewer_acceptance_passed'):
              raise SystemExit('final build trigger lacks explicit independent reviewer acceptance')
          registry = json.loads(Path('config/v082_paper_sources.json').read_text('utf-8'))
          keys = [p['key'] for p in registry['papers'] if int(p['order']) != 0]
          missing = []
          failed = []
          reviewer_rejected = []
          for key in keys:
              manifest = Path(f'content/v082_manifests/{key}.json')
              review = Path(f'content/v082_reviews/{key}.json')
              if not manifest.exists():
                  missing.append(f'manifest:{key}')
              if not review.exists():
                  missing.append(f'review:{key}')
                  continue
              review_state = json.loads(review.read_text('utf-8'))
              if not review_state.get('passed'):
                  failed.append(key)
              if not review_state.get('independent_reviewer_acceptance_passed'):
                  reviewer_rejected.append(key)
          if missing:
              raise SystemExit('missing reviewed outputs: ' + ', '.join(missing))
          if failed:
              raise SystemExit('failed strong-AI reviews: ' + ', '.join(failed))
          if reviewer_rejected:
              raise SystemExit('independent reviewer acceptance missing: ' + ', '.join(reviewer_rejected))
          print(json.dumps({'reviewed_papers': len(keys), 'passed': True}, indent=2))
          PY

      - name: Install source, manifest and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 PyMuPDF curl_cffi jsonschema lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Locate immutable original CANVAS reader
        shell: bash
        run: |
          set -euo pipefail
          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          test -n "$CANVAS"
          printf 'CANVAS_ORIGINAL=%q\n' "$CANVAS" > /tmp/v082_final_paths
          mkdir -p .build/v082/{pdfs,cho-source,lucas-source} final/V0.8.2/reports
          test -f templates/v082/V082_CANVAS_FROZEN_SHELL.html

      - name: Restore audited source PDF cache
        id: source_pdf_cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/prefetch_v082_blocked_sources.py') }}
          restore-keys: |
            v082-source-pdfs-

      - name: Restore dedicated user-supplied Cho source cache
        id: cho_cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/cho-source
          key: ${{ env.CHO_CACHE_KEY }}

      - name: Restore dedicated user-supplied Lucas source cache
        id: lucas_cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/lucas-source
          key: ${{ env.LUCAS_CACHE_KEY }}

      - name: Inject validated exact sources before source audit
        run: |
          set -euo pipefail
          test "${{ steps.cho_cache.outputs.cache-hit }}" = "true"
          test "${{ steps.lucas_cache.outputs.cache-hit }}" = "true"
          test -s .build/v082/cho-source/07_cho-2026.pdf
          test -s .build/v082/lucas-source/09_lucas-2024.pdf
          cp .build/v082/cho-source/07_cho-2026.pdf .build/v082/pdfs/07_cho-2026.pdf
          cp .build/v082/lucas-source/09_lucas-2024.pdf .build/v082/pdfs/09_lucas-2024.pdf

      - name: Prefetch publisher-blocked official PDFs
        id: blocked_source_prefetch
        continue-on-error: true
        run: |
          python tools/prefetch_v082_blocked_sources.py \
            --registry config/v082_paper_sources.json \
            --output-dir .build/v082/pdfs \
            --report final/V0.8.2/reports/BLOCKED_SOURCE_PREFETCH.json

      - name: Audit CANVAS baseline and obtain exact non-CANVAS sources
        id: source_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          python tools/download_v082_release_sources.py \
            --registry config/v082_paper_sources.json \
            --canonical-html "$CANVAS_ORIGINAL" \
            --output-dir .build/v082/pdfs \
            --report final/V0.8.2/reports/SOURCE_DOWNLOAD.json \
            --reuse

      - name: Reinject and verify exact user-supplied sources
        if: always()
        run: |
          set -euo pipefail
          cp .build/v082/cho-source/07_cho-2026.pdf .build/v082/pdfs/07_cho-2026.pdf
          cp .build/v082/lucas-source/09_lucas-2024.pdf .build/v082/pdfs/09_lucas-2024.pdf
          python - <<'PY'
          import fitz
          from pathlib import Path
          expected = {
              Path('.build/v082/pdfs/07_cho-2026.pdf'): (24, '10.1126/science.adz2742'),
              Path('.build/v082/pdfs/09_lucas-2024.pdf'): (31, '10.1038/s41588-024-01747-1'),
          }
          for path, (pages, doi) in expected.items():
              doc = fitz.open(path)
              try:
                  assert doc.page_count == pages, (path, doc.page_count, pages)
                  probe = {0, 1, doc.page_count - 1}
                  text = '\n'.join(doc.load_page(i).get_text('text') for i in probe).lower()
                  metadata = ' '.join(str(value or '') for value in doc.metadata.values()).lower()
                  assert doi.lower() in text or doi.lower() in metadata, (path, doi)
              finally:
                  doc.close()
          PY

      - name: Save rolling exact-source cache
        if: always() && steps.source_pdf_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/prefetch_v082_blocked_sources.py') }}

      - name: Run sequential reader build
        id: reader_build
        if: always() && steps.source_audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_final_paths
          python tools/run_v082_final_reader_build_v3.py \
            --canonical "$CANVAS_ORIGINAL" \
            --pdf-dir .build/v082/pdfs \
            --output-root final/V0.8.2 \
            --build-root .build/v082 \
            --materialized-shell templates/v082/V082_CANVAS_FROZEN_SHELL.html

      - name: Package only a passed final release
        if: steps.reader_build.outcome == 'success'
        run: |
          mkdir -p .build/release
          python - <<'PY'
          import json
          gate=json.load(open('final/V0.8.2/reports/FINAL_RELEASE_GATE.json'))
          if not gate.get('passed'):
              raise SystemExit('FINAL_RELEASE_GATE.json did not pass')
          if not (gate.get('layout_invariance') or {}).get('passed'):
              raise SystemExit('browser layout invariance did not pass')
          if not (gate.get('materialized_product_shell') or {}).get('passed'):
              raise SystemExit('materialized product shell provenance did not pass')
          PY
          zip -9 -r .build/release/V0.8.2_FINAL_READERS.zip final/V0.8.2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-final-reader-build-audit
          path: |
            final/V0.8.2
            .build/v082/final-evidence
            .build/release/V0.8.2_FINAL_READERS.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce fail-closed final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.source_audit.outcome }}" != "success" ]; then
            cat final/V0.8.2/reports/BLOCKED_SOURCE_PREFETCH.json || true
            cat final/V0.8.2/reports/SOURCE_DOWNLOAD.json || true
            exit 1
          fi
          if [ "${{ steps.reader_build.outcome }}" != "success" ]; then
            cat final/V0.8.2/reports/PRODUCT_SHELL_PROVENANCE.json || true
            cat final/V0.8.2/reports/SEQUENTIAL_READER_BUILD.json || true
            cat final/V0.8.2/reports/LAYOUT_INVARIANCE.json || true
            find final/V0.8.2/reports -maxdepth 1 -name '*_BUILD_READINESS.json' -print -exec cat {} \;
            exit 1
          fi
          test -f final/V0.8.2/reports/FINAL_RELEASE_GATE.json
          python - <<'PY'
          import json
          gate=json.load(open('final/V0.8.2/reports/FINAL_RELEASE_GATE.json'))
          if not gate.get('passed'):
              raise SystemExit('FINAL_RELEASE_GATE.json did not pass')
          PY

      - name: Stage final branch snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/V0.8.2
          if git diff --cached --quiet; then
            echo "Final release snapshot already current"
          else
            git commit -m "Build complete V0.8.2 final paper readers"
            git fetch origin v0.8x-batch-diagnosis
            git rebase origin/v0.8x-batch-diagnosis
            git push origin HEAD:v0.8x-batch-diagnosis
          fi
