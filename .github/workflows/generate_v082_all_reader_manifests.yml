name: Generate all V0.8.2 reader manifests sequentially

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generate_v082_all_reader_manifests.yml"
      - "tools/generate_v082_reader_manifest_with_github_models*.py"
      - "tools/build_pdf_native_manifest_v082*.py"
      - "tools/v082_body_reconstruction*.py"
      - "tools/validate_v082_evidence_quality*.py"
      - "tools/validate_v082_reader_content_quality.py"
      - "tools/validate_v082_final_manifest.py"
      - "tools/validate_v082_manifest_code_boundary.py"
      - "config/v082_reader_content_plans/**"
      - "config/v082_paper_sources.json"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: v082-generate-all-reader-manifests-sequentially
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  GITHUB_MODELS_MODEL: "openai/gpt-4.1"

jobs:
  generate-sequentially:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8x-batch-diagnosis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source, evidence and manifest dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 PyMuPDF curl_cffi jsonschema lxml pillow

      - name: Locate immutable CANVAS reader
        run: |
          CANVAS=$(find . -maxdepth 1 -name '00_V0.8.2_CANVAS*.html' | head -n 1)
          test -n "$CANVAS"
          printf 'CANVAS_ORIGINAL=%q\n' "$CANVAS" > /tmp/v082_manifest_paths
          mkdir -p .build/v082/{pdfs,batch-evidence,batch-audits,batch-reports,model-cache} content/v082_manifests

      - name: Restore audited PDF cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/pdfs
          key: v082-source-pdfs-${{ hashFiles('config/v082_paper_sources.json', 'tools/download_v082_sources.py', 'tools/download_v082_release_sources.py', 'tools/download_v082_release_sources_continue.py', 'tools/prefetch_v082_blocked_sources.py') }}
          restore-keys: |
            v082-source-pdfs-

      - name: Restore all GitHub Models response caches
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/v082/model-cache
          key: v082-model-cache-all-${{ hashFiles('tools/generate_v082_reader_manifest_with_github_models*.py', 'config/v082_reader_content_plans/*.json') }}
          restore-keys: |
            v082-model-cache-all-
            v082-model-cache-lee-

      - name: Obtain every exact PDF that is currently reachable
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v082_manifest_paths
          python tools/prefetch_v082_blocked_sources.py \
            --registry config/v082_paper_sources.json \
            --output-dir .build/v082/pdfs \
            --report .build/v082/batch-reports/BLOCKED_SOURCE_PREFETCH.json || true
          python tools/download_v082_release_sources_continue.py \
            --registry config/v082_paper_sources.json \
            --canonical-html "$CANVAS_ORIGINAL" \
            --output-dir .build/v082/pdfs \
            --report .build/v082/batch-reports/SOURCE_DOWNLOAD_AVAILABLE.json \
            --reuse || true

      - name: Generate and gate manifests one paper at a time
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import pathlib
          import subprocess
          import sys
          import traceback

          root = pathlib.Path('.')
          registry = json.loads((root / 'config/v082_paper_sources.json').read_text('utf-8'))
          papers = sorted(registry['papers'], key=lambda item: item['order'])
          pdf_dir = root / '.build/v082/pdfs'
          evidence_dir = root / '.build/v082/batch-evidence'
          audit_dir = root / '.build/v082/batch-audits'
          report_dir = root / '.build/v082/batch-reports'
          manifest_dir = root / 'content/v082_manifests'
          for directory in (evidence_dir, audit_dir, report_dir, manifest_dir):
              directory.mkdir(parents=True, exist_ok=True)

          def run(command: list[str]) -> subprocess.CompletedProcess[str]:
              print('+', ' '.join(command), flush=True)
              result = subprocess.run(command, text=True, capture_output=True)
              if result.stdout:
                  print(result.stdout, end='', flush=True)
              if result.stderr:
                  print(result.stderr, end='', file=sys.stderr, flush=True)
              return result

          statuses = []
          for paper in papers:
              if int(paper['order']) == 0:
                  continue
              key = paper['key']
              order = int(paper['order'])
              pdf = pdf_dir / f'{order:02d}_{key}.pdf'
              evidence = evidence_dir / f'{key}.json'
              audit = audit_dir / f'{key}.json'
              manifest = manifest_dir / f'{key}.json'
              plan = root / 'config/v082_reader_content_plans' / f'{key}.json'
              paper_reports = report_dir / key
              paper_reports.mkdir(parents=True, exist_ok=True)
              status = {
                  'order': order,
                  'key': key,
                  'pdf_available': pdf.exists(),
                  'manifest_preexisting': manifest.exists(),
                  'passed': False,
                  'steps': {},
              }
              statuses.append(status)
              print(f'\n===== READER MANIFEST {order:02d} {key} =====', flush=True)
              if not pdf.exists():
                  status['reason'] = 'exact source PDF unavailable'
                  continue
              try:
                  commands = [
                      ('evidence', [
                          sys.executable, 'tools/build_pdf_native_manifest_v082.py', str(pdf), str(evidence),
                          '--registry', 'config/v082_paper_sources.json', '--key', key, '--audit', str(audit),
                      ]),
                      ('evidence_quality', [
                          sys.executable, 'tools/validate_v082_evidence_quality_v5.py', str(evidence),
                          '--audit', str(audit), '--report', str(paper_reports / 'EVIDENCE_QUALITY.json'),
                      ]),
                  ]
                  for name, command in commands:
                      result = run(command)
                      status['steps'][name] = {'returncode': result.returncode}
                      if result.returncode != 0:
                          raise RuntimeError(f'{name} failed')

                  # Regenerate deterministically from the evidence and model cache. An existing
                  # manifest is never trusted without reproducing all source and reader gates.
                  result = run([
                      sys.executable, 'tools/generate_v082_reader_manifest_with_github_models_v3.py',
                      str(evidence), str(plan), str(manifest), '--cache-dir', '.build/v082/model-cache',
                  ])
                  status['steps']['generation'] = {'returncode': result.returncode}
                  if result.returncode != 0:
                      raise RuntimeError('generation failed')

                  validations = [
                      ('reader_content', [
                          sys.executable, 'tools/validate_v082_reader_content_quality.py', str(manifest),
                          '--report', str(paper_reports / 'READER_CONTENT.json'),
                      ]),
                      ('final_manifest', [
                          sys.executable, 'tools/validate_v082_final_manifest.py', str(manifest),
                          '--schema', 'schemas/paper_content_manifest_v082.schema.json',
                          '--audit', str(audit), '--report', str(paper_reports / 'FINAL_MANIFEST.json'),
                      ]),
                      ('code_boundary', [
                          sys.executable, 'tools/validate_v082_manifest_code_boundary.py', str(manifest),
                          '--report', str(paper_reports / 'CODE_BOUNDARY.json'),
                      ]),
                  ]
                  for name, command in validations:
                      result = run(command)
                      status['steps'][name] = {'returncode': result.returncode}
                      if result.returncode != 0:
                          raise RuntimeError(f'{name} failed')
                  status['passed'] = True
                  status['reason'] = 'source evidence and completed bilingual manifest passed all gates'
              except Exception as exc:
                  status['reason'] = f'{type(exc).__name__}: {exc}'
                  status['traceback'] = traceback.format_exc()[-4000:]

              (report_dir / 'SEQUENTIAL_MANIFEST_GENERATION.json').write_text(
                  json.dumps({'papers': statuses}, ensure_ascii=False, indent=2) + '\n', 'utf-8'
              )

          available = [item for item in statuses if item['pdf_available']]
          missing = [item['key'] for item in statuses if not item['pdf_available']]
          failed_available = [item['key'] for item in available if not item['passed']]
          summary = {
              'version': 'v082-sequential-model-manifest-generation-1',
              'expected_non_canvas': len(statuses),
              'available_pdf_count': len(available),
              'passed_available_count': sum(item['passed'] for item in available),
              'missing_pdf_keys': missing,
              'failed_available_keys': failed_available,
              'papers': statuses,
              'all_available_passed': bool(available) and not failed_available,
              'all_expected_passed': len(statuses) == len(available) and not failed_available,
          }
          (report_dir / 'SEQUENTIAL_MANIFEST_GENERATION.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if failed_available:
              raise SystemExit('one or more available PDFs failed manifest generation or gates')
          PY

      - name: Commit every newly validated manifest in one atomic snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/v082_manifests
          if git diff --cached --quiet; then
            echo "All available validated manifests already current"
          else
            git commit -m "Add validated V0.8.2 bilingual reader manifests"
            git fetch origin v0.8x-batch-diagnosis
            git rebase origin/v0.8x-batch-diagnosis
            git push origin HEAD:v0.8x-batch-diagnosis
          fi

      - name: Save rolling exact-source cache
        if: always() && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/v082/pdfs
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - name: Save GitHub Models caches even after a later gate failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build/v082/model-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v082-all-reader-manifest-audit
          path: |
            content/v082_manifests
            .build/v082/batch-evidence
            .build/v082/batch-audits
            .build/v082/batch-reports
          if-no-files-found: warn
          retention-days: 30
